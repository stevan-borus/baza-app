appId: ${APP_ID}
name: "Admin can create, edit, and delete a PackageType"
tags:
  - android-only
env:
  EMAIL: "admin.e2e@example.test"
  PASSWORD: "Password123!"
  PACKAGE_NAME: "E2E Package A"
  PACKAGE_NAME_EDITED: "E2E Package A Edited"
  CLASS_TYPE_LABEL: "Reformer pilates"
---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

- runFlow:
    when:
      visible: ".*Retry.*"
    file: helpers/dismiss-error.yaml

- runFlow:
    file: helpers/sign-in.yaml

# Navigate to the Packages tab.
- extendedWaitUntil:
    visible:
      id: "tab-packages"
    timeout: 15000
- tapOn:
    id: "tab-packages"
- waitForAnimationToEnd

# Create.
- extendedWaitUntil:
    visible:
      id: "admin-new-package-button"
    timeout: 15000
- tapOn:
    id: "admin-new-package-button"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "package-name-input"
    timeout: 5000
- tapOn:
    id: "package-name-input"
- inputText: ${PACKAGE_NAME}

- runFlow:
    when:
      platform: android
    commands:
      - hideKeyboard

# Toggle a ClassType chip from the seed (multi-select; one chip = classic SKU).
- extendedWaitUntil:
    visible: ${CLASS_TYPE_LABEL}
    timeout: 5000
- tapOn: ${CLASS_TYPE_LABEL}
- waitForAnimationToEnd

- tapOn:
    id: "package-session-count-input"
- inputText: "8"
- runFlow:
    when:
      platform: android
    commands:
      - hideKeyboard

- tapOn:
    id: "package-validity-days-input"
- inputText: "30"
- runFlow:
    when:
      platform: android
    commands:
      - hideKeyboard

- tapOn:
    id: "package-create-submit"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: ${PACKAGE_NAME}
    timeout: 10000

# Edit.
- tapOn: ${PACKAGE_NAME}
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "package-edit-name-input"
    timeout: 5000
- tapOn:
    id: "package-edit-name-input"
- eraseText: 50
- inputText: ${PACKAGE_NAME_EDITED}

- runFlow:
    when:
      platform: android
    commands:
      - hideKeyboard

- tapOn:
    id: "package-edit-save-button"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: ${PACKAGE_NAME_EDITED}
    timeout: 10000

# Delete.
- tapOn: ${PACKAGE_NAME_EDITED}
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "package-edit-delete-button"
    timeout: 5000
- tapOn:
    id: "package-edit-delete-button"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "package-delete-confirm-button"
    timeout: 5000
- tapOn:
    id: "package-delete-confirm-button"
- waitForAnimationToEnd

- assertNotVisible: ${PACKAGE_NAME_EDITED}
