appId: ${APP_ID}
name: "Admin can navigate to clients → invites segment and reach the new-invite trigger"
env:
  EMAIL: "admin.e2e@example.test"
  PASSWORD: "Password123!"
---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

- runFlow:
    when:
      visible: ".*Retry.*"
    file: helpers/dismiss-error.yaml

- runFlow:
    file: helpers/sign-in.yaml

- tapOn:
    id: "tab-clients"

- waitForAnimationToEnd

- tapOn:
    id: "admin-clients-tab-invites"

- waitForAnimationToEnd

# The invite sheet (gorhom BottomSheetModal) is not reachable through
# Maestro's iOS hierarchy reader. We verify the trigger button mounts
# on the Invites segment; sheet-internal flow is covered by Phase A
# Playwright (`admin.spec.ts` spec 31).
- extendedWaitUntil:
    visible:
      id: "admin-new-invite-button"
    timeout: 15000

- tapOn:
    id: "admin-new-invite-button"

- waitForAnimationToEnd
