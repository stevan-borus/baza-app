appId: ${APP_ID}
name: "Admin can navigate to clients → invites segment and reach the new-invite trigger"
env:
  EMAIL: "admin.e2e@example.test"
  PASSWORD: "Password123!"
---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

- runFlow:
    when:
      visible: ".*Retry.*"
    file: helpers/dismiss-error.yaml

- runFlow:
    file: helpers/sign-in.yaml

- tapOn:
    id: "tab-klijenti"

- waitForAnimationToEnd

# The invite sheet (gorhom BottomSheetModal) is not reachable through
# Maestro's iOS hierarchy reader. We verify the add-client trigger button
# mounts (the "+" now always opens the invite flow, on any tab); the
# sheet-internal flow is covered by Phase A Playwright (`admin.spec.ts`).
- extendedWaitUntil:
    visible:
      id: "admin-new-client-button"
    timeout: 15000

- tapOn:
    id: "admin-new-client-button"

- waitForAnimationToEnd
