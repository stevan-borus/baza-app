appId: ${APP_ID}
name: "Admin can create, edit, and delete a StudioRoom"
tags:
  - android-only
env:
  EMAIL: "admin.e2e@example.test"
  PASSWORD: "Password123!"
  ROOM_NAME: "E2E Room A"
  ROOM_NAME_EDITED: "E2E Room A Edited"
---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

- runFlow:
    when:
      visible: ".*Retry.*"
    file: helpers/dismiss-error.yaml

- runFlow:
    file: helpers/sign-in.yaml

- extendedWaitUntil:
    visible:
      id: "admin-quick-rooms"
    timeout: 15000
- tapOn:
    id: "admin-quick-rooms"
- waitForAnimationToEnd

# Create.
- extendedWaitUntil:
    visible:
      id: "admin-new-room-button"
    timeout: 15000
- tapOn:
    id: "admin-new-room-button"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "room-name-input"
    timeout: 5000
- tapOn:
    id: "room-name-input"
- inputText: ${ROOM_NAME}

- runFlow:
    when:
      platform: android
    commands:
      - hideKeyboard

- tapOn:
    id: "room-create-submit"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: ${ROOM_NAME}
    timeout: 10000

# Edit.
- tapOn: ${ROOM_NAME}
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "room-edit-name-input"
    timeout: 5000
- tapOn:
    id: "room-edit-name-input"
- eraseText: 50
- inputText: ${ROOM_NAME_EDITED}

- runFlow:
    when:
      platform: android
    commands:
      - hideKeyboard

- tapOn:
    id: "room-edit-save-button"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: ${ROOM_NAME_EDITED}
    timeout: 10000

# Delete.
- tapOn: ${ROOM_NAME_EDITED}
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "room-edit-delete-button"
    timeout: 5000
- tapOn:
    id: "room-edit-delete-button"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "room-delete-confirm-button"
    timeout: 5000
- tapOn:
    id: "room-delete-confirm-button"
- waitForAnimationToEnd

- assertNotVisible: ${ROOM_NAME_EDITED}
