appId: ${APP_ID}
name: "Client can enter their reset token on the reset screen"
env:
  EMAIL: "client.active.reformer@e2e.test"
  RESET_PASSWORD: "Password123!Reset1"
---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

- runFlow:
    when:
      visible: ".*Retry.*"
    file: helpers/dismiss-error.yaml

- assertVisible: "Zaboravljena lozinka?"
- tapOn: "Zaboravljena lozinka?"

- waitForAnimationToEnd

- assertVisible: "Reset lozinke"

# Skip the email-request step — RESET_TOKEN is captured by the prior
# password-reset-request.yaml run and injected via -e by the runner.
- tapOn: "Već imam token"

- waitForAnimationToEnd

- tapOn:
    id: "reset-token-input"
- inputText: ${RESET_TOKEN}

# Confirm we reached the populated token-entry step. We can't assert the
# typed token text directly: our custom Input renders a TextInput whose value
# doesn't surface to iOS accessibility (XCUITest reads the field as its
# a11y label, not its content), so `assertVisible: <token>` can never match.
# Asserting the submit button — only mounted on this step — verifies the form
# accepted input and is ready. On iOS the flow stops here: typing into
# reset-new-password-input hits an autofill quirk on
# `<TextInput textContentType="newPassword">` that blanks the Maestro-typed
# value before submit. Phase A Playwright (`auth-extended.spec.ts`) covers the
# full cycle on web. Android RN ignores `textContentType`, so the
# platform-gated block below runs the full new-password → submit → success.
- assertVisible:
    id: "reset-submit-button"

- runFlow:
    when:
      platform: android
    commands:
      - tapOn:
          id: "reset-new-password-input"
      - inputText: ${RESET_PASSWORD}
      - hideKeyboard
      - tapOn:
          id: "reset-submit-button"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "Lozinka ažurirana"
          timeout: 15000
