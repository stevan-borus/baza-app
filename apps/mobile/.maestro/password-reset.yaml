appId: ${APP_ID}
name: "Client can enter their reset token on the reset screen"
env:
  EMAIL: "client.active.reformer@e2e.test"
  RESET_PASSWORD: "Password123!Reset1"
---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

- runFlow:
    when:
      visible: ".*Retry.*"
    file: helpers/dismiss-error.yaml

- assertVisible: "Zaboravljena lozinka?"
- tapOn: "Zaboravljena lozinka?"

- waitForAnimationToEnd

- assertVisible: "Reset lozinke"

# Skip the email-request step — RESET_TOKEN is captured by the prior
# password-reset-request.yaml run and injected via -e by the runner.
- tapOn: "Već imam token"

- waitForAnimationToEnd

- tapOn:
    id: "reset-token-input"
- inputText: ${RESET_TOKEN}

# Verify the token field accepted the value. On iOS, the flow stops
# here: typing into reset-new-password-input hits an autofill quirk
# on `<TextInput textContentType="newPassword">` that blanks the
# Maestro-typed value before submit. Phase A Playwright
# (`auth-extended.spec.ts`) covers the full cycle on web for iOS.
# Android RN ignores `textContentType`, so the platform-gated block
# below runs the full new-password → submit → success cycle natively.
- assertVisible: ${RESET_TOKEN}

- runFlow:
    when:
      platform: android
    commands:
      - tapOn:
          id: "reset-new-password-input"
      - inputText: ${RESET_PASSWORD}
      - hideKeyboard
      - tapOn:
          id: "reset-submit-button"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "Lozinka ažurirana"
          timeout: 15000
