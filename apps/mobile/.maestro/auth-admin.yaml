appId: ${APP_ID}
name: "Admin can sign in and see dashboard"
env:
  EMAIL: "admin.e2e@example.test"
  PASSWORD: "Password123!"
---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

- runFlow:
    when:
      visible: ".*Retry.*"
    file: helpers/dismiss-error.yaml

- runFlow:
    file: helpers/sign-in.yaml

# Admin landing renders ScreenContainerRaw title={t("tabs.dashboard")} → "Pregled".
- assertVisible: "Pregled"
