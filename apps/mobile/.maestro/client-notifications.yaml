appId: ${APP_ID}
name: "Client can navigate to notifications"
env:
  EMAIL: "client.active.reformer@e2e.test"
  PASSWORD: "Password123!"
---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

- runFlow:
    when:
      visible: ".*Retry.*"
    file: helpers/dismiss-error.yaml

- runFlow:
    file: helpers/sign-in.yaml

- tapOn:
    id: "tab-notifications"

- waitForAnimationToEnd

# Title from t("tabs.notifications"). Notifications preferences live in
# a gorhom bottom-sheet that Maestro's iOS view-hierarchy reader cannot
# traverse, so we only verify the tab itself navigates.
- extendedWaitUntil:
    visible: "Obaveštenja"
    timeout: 15000
