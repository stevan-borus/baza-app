appId: ${APP_ID}
name: "Password reset request captures a token"
env:
  EMAIL: "client.active.reformer@e2e.test"
---
- launchApp:
    clearState: true
    clearKeychain: true

- waitForAnimationToEnd

- runFlow:
    when:
      visible: ".*Retry.*"
    file: helpers/dismiss-error.yaml

- assertVisible: "Zaboravljena lozinka?"
- tapOn: "Zaboravljena lozinka?"

- waitForAnimationToEnd

# Step 1 of the reset screen — title from t("auth.resetPasswordTitle").
- assertVisible: "Reset lozinke"

- tapOn:
    id: "reset-email-input"
- inputText: ${EMAIL}

# Android: dismiss the soft keyboard so reset-send-link-button is
# reachable. iOS keeps the button visible above the keyboard.
- runFlow:
    when:
      platform: android
    commands:
      - hideKeyboard

- tapOn:
    id: "reset-send-link-button"

- waitForAnimationToEnd

# Step 2 mounts after onSuccess: title from t("auth.checkEmail").
# When the request fires, sendResetEmail also writes the token to
# .maestro/.tmp/password-reset-token.json (E2E_RESET_TOKEN_FILE) which the
# run-e2e.sh script reads back via get-latest-reset-token.ts.
- assertVisible: "Proverite email"
